[project]
name = "openlr-demo"
version = "0.1.0"
description = "Demonstrator: OpenLR line locations vs. plain linestring map matching on stacked roads in Tokyo (OSM)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openlr==1.0.1",
    "openlr-dereferencer>=1.2.0",
    "shapely>=2.0",
    "geographiclib>=2.0",
    "osmium>=4.0",
    "folium>=0.17",
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.scripts]
openlr-demo = "openlr_demo.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.poetry]
packages = [{ include = "openlr_demo", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
